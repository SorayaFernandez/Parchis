<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

<!--
  CIRCUITOS DE LAS CASAS (solo decoración).
  Un único dibujo para las cuatro zonas, en coordenadas de la zona (0–340) y con simetría de 4 lados:
  el lado superior se repite girado 90°, 180° y 270° alrededor del centro (170, 170). El recuadro interior
  (75–265) tapa el centro, así que el circuito ocupa solo la franja entre el borde de la zona y el recuadro.
  Cada patrón mide exactamente lo que su zona y empieza en su esquina: las cuatro quedan iguales y solo
  cambia el color (`color` → `currentColor`). Las vías tienen el relleno del fondo para cortar las pistas.
-->
<g id="circuit-side">
  <!-- Halo suave de la pista principal (profundidad sin filtros) -->
  <path d="M40 62 L62 40 H278" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.08"/>
  <!-- Pista principal: anillo con esquinas en chaflán -->
  <path d="M40 62 L62 40 H278" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <!-- Pista exterior, unida a la principal a 45° -->
  <path d="M110 40 L128 22 H212 L230 40" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.32"/>
  <!-- Pista interior, junto al recuadro -->
  <path d="M84 66 L92 58 H248 L256 66" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.32"/>
  <path d="M170 40 V58" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity="0.32"/>
  <!-- Vías -->
  <g fill="#050816" stroke="currentColor" stroke-width="1.6" opacity="0.75">
    <circle cx="51" cy="51" r="4.5"/>
    <circle cx="110" cy="40" r="4"/>
    <circle cx="170" cy="40" r="4"/>
    <circle cx="230" cy="40" r="4"/>
  </g>
  <g fill="currentColor" opacity="0.6">
    <circle cx="51" cy="51" r="1.6"/>
    <circle cx="110" cy="40" r="1.4"/>
    <circle cx="170" cy="40" r="1.4"/>
    <circle cx="230" cy="40" r="1.4"/>
    <circle cx="84" cy="66" r="2.2"/>
    <circle cx="256" cy="66" r="2.2"/>
    <circle cx="170" cy="58" r="2"/>
  </g>
</g>

<g id="circuit-art" fill="none">
  <use href="#circuit-side"/>
  <use href="#circuit-side" transform="rotate(90 170 170)"/>
  <use href="#circuit-side" transform="rotate(180 170 170)"/>
  <use href="#circuit-side" transform="rotate(270 170 170)"/>
</g>

<!-- Un patrón por color, del tamaño de su zona y alineado con ella. La opacidad iguala la luminosidad
     percibida (el verde y el azul se ven más brillantes que el rosa y el morado). -->
<pattern id="circuit-pink" x="30" y="30" width="340" height="340" patternUnits="userSpaceOnUse">
  <use href="#circuit-art" color="#ff3bd4"/>
</pattern>

<pattern id="circuit-green" x="630" y="30" width="340" height="340" patternUnits="userSpaceOnUse">
  <use href="#circuit-art" color="#00ff9d" opacity="0.8"/>
</pattern>

<pattern id="circuit-blue" x="30" y="630" width="340" height="340" patternUnits="userSpaceOnUse">
  <use href="#circuit-art" color="#00d9ff" opacity="0.85"/>
</pattern>

<pattern id="circuit-purple" x="630" y="630" width="340" height="340" patternUnits="userSpaceOnUse">
  <use href="#circuit-art" color="#c86cff"/>
</pattern>

</defs>

<rect width="1000" height="1000" rx="60" fill="#050816"/>

<!-- PLAYER ZONES -->

<rect x="30" y="30" width="340" height="340" rx="40"
fill="url(#circuit-pink)"
opacity="0.9"
stroke="#ff3bd4"
stroke-width="10"/>

<rect x="630" y="30" width="340" height="340" rx="40"
fill="url(#circuit-green)"
opacity="0.9"
stroke="#00ff9d"
stroke-width="10"/>

<rect x="30" y="630" width="340" height="340" rx="40"
fill="url(#circuit-blue)"
opacity="0.9"
stroke="#00d9ff"
stroke-width="10"/>

<rect x="630" y="630" width="340" height="340" rx="40"
fill="url(#circuit-purple)"
opacity="0.9"
stroke="#c86cff"
stroke-width="10"/>

<!-- INNER HOMES -->

<rect x="105" y="105" width="190" height="190" rx="30"
fill="#050816"
stroke="#ff69e7"
stroke-width="6"/>

<rect x="705" y="105" width="190" height="190" rx="30"
fill="#050816"
stroke="#52ffb8"
stroke-width="6"/>

<rect x="105" y="705" width="190" height="190" rx="30"
fill="#050816"
stroke="#52dfff"
stroke-width="6"/>

<rect x="705" y="705" width="190" height="190" rx="30"
fill="#050816"
stroke="#d88cff"
stroke-width="6"/>

<!-- BASE CIRCLES -->

<!-- pink -->
<circle cx="155" cy="155" r="22" fill="#2d1026" stroke="#ff4fd8" stroke-width="3"/>
<circle cx="245" cy="155" r="22" fill="#2d1026" stroke="#ff4fd8" stroke-width="3"/>
<circle cx="155" cy="245" r="22" fill="#2d1026" stroke="#ff4fd8" stroke-width="3"/>
<circle cx="245" cy="245" r="22" fill="#2d1026" stroke="#ff4fd8" stroke-width="3"/>

<!-- green -->
<circle cx="755" cy="155" r="22" fill="#10261c" stroke="#37ff99" stroke-width="3"/>
<circle cx="845" cy="155" r="22" fill="#10261c" stroke="#37ff99" stroke-width="3"/>
<circle cx="755" cy="245" r="22" fill="#10261c" stroke="#37ff99" stroke-width="3"/>
<circle cx="845" cy="245" r="22" fill="#10261c" stroke="#37ff99" stroke-width="3"/>

<!-- blue -->
<circle cx="155" cy="755" r="22" fill="#102030" stroke="#37b8ff" stroke-width="3"/>
<circle cx="245" cy="755" r="22" fill="#102030" stroke="#37b8ff" stroke-width="3"/>
<circle cx="155" cy="845" r="22" fill="#102030" stroke="#37b8ff" stroke-width="3"/>
<circle cx="245" cy="845" r="22" fill="#102030" stroke="#37b8ff" stroke-width="3"/>

 <!-- purple -->
<circle cx="755" cy="755" r="22" fill="#24122d" stroke="#bb6cff" stroke-width="3"/>
<circle cx="845" cy="755" r="22" fill="#24122d" stroke="#bb6cff" stroke-width="3"/>
<circle cx="755" cy="845" r="22" fill="#24122d" stroke="#bb6cff" stroke-width="3"/>
<circle cx="845" cy="845" r="22" fill="#24122d" stroke="#bb6cff" stroke-width="3"/>

</svg>